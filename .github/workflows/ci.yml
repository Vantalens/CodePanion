name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows build and tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install dependencies
        run: npm ci

      - name: Check whitespace
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            git diff --check "origin/$env:GITHUB_BASE_REF...HEAD"
          } elseif ((git rev-list --count HEAD) -gt 1) {
            git diff --check "HEAD~1..HEAD"
          } else {
            git diff --check
          }

      - name: Run daemon tests + DTO drift check
        run: npm test

      - name: Run npm audit
        run: npm audit --audit-level=moderate

      - name: Run Rust tests
        working-directory: codepanion-rust
        run: cargo test --workspace

      - name: Run Rust clippy
        working-directory: codepanion-rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check Rust formatting
        working-directory: codepanion-rust
        run: cargo fmt --all -- --check

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust workspace dependencies
        working-directory: codepanion-rust
        run: cargo audit

      - name: Audit Tauri dependency lockfile
        working-directory: packages/gui/src-tauri
        run: cargo audit

      - name: Validate extension manifests + activation contract
        run: npm run validate:extensions

      - name: Build GUI
        run: npm run gui:build

      - name: Package Windows portable build
        shell: pwsh
        run: |
          $env:CODEPANION_NODE_PATH = (Get-Command node).Source
          npm run package:windows
