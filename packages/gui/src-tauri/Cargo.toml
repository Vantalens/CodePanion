[package]
name = "codepanion-gui"
version = "0.1.0"
description = "CodePanion Tauri GUI"
authors = ["CodePanion"]
license = "MIT"
repository = "https://github.com/Vantalens/CodePanion"
edition = "2021"

[lib]
name = "codepanion_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "CodePanion"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11", features = [] }
