<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://codepanion.local; script-src 'self' https://codepanion.local 'unsafe-inline'; style-src 'self' https://codepanion.local 'unsafe-inline'; img-src 'self' https://codepanion.local data:; font-src 'self' https://codepanion.local data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodePanion</title>
    <link rel="stylesheet" href="https://codepanion.local/codex.css">
</head>
<body>
    <div id="app">
        <!-- 侧边栏 -->
        <aside id="sidebar">
            <div class="sidebar-header">
                <h1 class="app-title">CodePanion</h1>
                <button id="new-chat-btn" class="icon-btn" title="新建对话">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                </button>
            </div>

            <!-- 项目列表（可折叠） -->
            <div class="projects-section">
                <div class="section-header">
                    <button class="section-toggle" data-section="projects">
                        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 18l6-6-6-6"/>
                        </svg>
                        <span>项目</span>
                    </button>
                    <button id="projects-add-btn" class="icon-btn-tiny" title="添加项目">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                    </button>
                </div>
                <div id="projects-list" class="projects-list"></div>
            </div>

            <!-- 会话列表（可折叠） -->
            <div class="sessions-section">
                <div class="section-header">
                    <button class="section-toggle active" data-section="sessions">
                        <svg class="chevron active" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 18l6-6-6-6"/>
                        </svg>
                        <span>对话</span>
                    </button>
                    <span id="session-count" class="count-badge">0</span>
                </div>
                <div id="sessions-list" class="sessions-list"></div>
            </div>

            <!-- 侧边栏底部 -->
            <div class="sidebar-footer">
                <button id="workflow-btn" class="sidebar-menu-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"/>
                        <rect x="14" y="3" width="7" height="7"/>
                        <rect x="14" y="14" width="7" height="7"/>
                        <rect x="3" y="14" width="7" height="7"/>
                    </svg>
                    <span>工作流</span>
                </button>
                <button id="settings-btn" class="sidebar-menu-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M12 1v6m0 6v6m6-6h6M1 12h6"/>
                    </svg>
                    <span>设置</span>
                </button>
                <div class="connection-status">
                    <span id="status-dot" class="status-dot"></span>
                    <span id="status-text" class="status-text">未连接</span>
                </div>
            </div>
        </aside>

        <!-- 主聊天区域 -->
        <main id="main-content">
            <!-- 空状态 -->
            <div id="empty-state" class="empty-state">
                <div class="empty-state-content">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                    <h2>欢迎使用 CodePanion</h2>
                    <p>输入你的问题或任务，开始对话</p>
                </div>
            </div>

            <!-- 对话区域 -->
            <div id="chat-container" class="chat-container" hidden>
                <div id="messages" class="messages"></div>

                <!-- 输入区域 -->
                <div class="input-container">
                    <div class="input-wrapper">
                        <textarea
                            id="message-input"
                            class="message-input"
                            placeholder="输入消息... (Shift+Enter 换行，Enter 发送)"
                            rows="1"
                        ></textarea>
                        <div class="input-actions">
                            <button id="attach-btn" class="icon-btn-small" title="附加文件">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                                </svg>
                            </button>
                            <button id="send-btn" class="send-btn" title="发送 (Enter)">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="input-hint">
                        <span class="hint-text">Shift+Enter 换行 • Enter 发送</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 项目表单对话框 -->
    <div id="project-form-dialog" class="dialog-overlay" hidden>
        <div class="dialog-box dialog-small">
            <header class="dialog-header">
                <h3 id="project-form-title">添加项目</h3>
                <button class="dialog-close" data-close="project-form-dialog">×</button>
            </header>
            <div class="dialog-body">
                <form id="project-form">
                    <input type="hidden" id="project-form-id" value="">
                    <div class="form-field">
                        <label for="project-form-name">项目名称 *</label>
                        <input id="project-form-name" type="text" required placeholder="例如：我的项目">
                    </div>
                    <div class="form-field">
                        <label for="project-form-path">项目路径 *</label>
                        <input id="project-form-path" type="text" required placeholder="D:\Projects\MyApp">
                    </div>
                    <div class="form-field">
                        <label for="project-form-description">描述（可选）</label>
                        <textarea id="project-form-description" rows="2" placeholder="项目简介"></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">保存</button>
                        <button type="button" class="btn" data-close="project-form-dialog">取消</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 设置对话框 -->
    <div id="settings-dialog" class="dialog-overlay" hidden>
        <div class="dialog-box dialog-large">
            <header class="dialog-header">
                <h3>设置</h3>
                <button id="settings-dialog-close" class="dialog-close" data-close="settings-dialog">×</button>
            </header>
            <div class="dialog-body">
                <div class="settings-tabs">
                    <button class="settings-tab active" data-tab="providers">Providers</button>
                    <button class="settings-tab" data-tab="models">模型配置</button>
                </div>

                <!-- Providers 标签页 -->
                <div id="settings-providers" class="settings-content">
                    <div class="dialog-toolbar">
                        <button id="provider-add" class="btn btn-primary">+ 添加 Provider</button>
                    </div>
                    <div id="provider-list" class="provider-list"></div>
                </div>

                <!-- 模型配置标签页 -->
                <div id="settings-models" class="settings-content" hidden>
                    <div id="model-config-container"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Provider 表单对话框 -->
    <div id="provider-form-dialog" class="dialog-overlay" hidden>
        <div class="dialog-box dialog-small">
            <header class="dialog-header">
                <h3 id="provider-form-title">添加 Provider</h3>
                <button id="provider-form-close" class="dialog-close" data-close="provider-form-dialog">×</button>
            </header>
            <div class="dialog-body">
                <form id="provider-form">
                    <input type="hidden" id="provider-form-id" value="">
                    <div class="form-field">
                        <label for="provider-form-name">Provider 名称 *</label>
                        <input id="provider-form-name" type="text" required placeholder="例如：OpenAI">
                    </div>
                    <div class="form-field">
                        <label for="provider-form-type">类型 *</label>
                        <select id="provider-form-type" required>
                            <option value="openai">OpenAI</option>
                            <option value="anthropic">Anthropic</option>
                            <option value="deepseek">DeepSeek</option>
                            <option value="custom">Custom</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label for="provider-form-apikey">API Key *</label>
                        <input id="provider-form-apikey" type="password" required placeholder="sk-...">
                    </div>
                    <div class="form-field">
                        <label for="provider-form-apibase">API Base URL</label>
                        <input id="provider-form-apibase" type="text" placeholder="https://api.openai.com/v1">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">保存</button>
                        <button id="provider-form-cancel" type="button" class="btn" data-close="provider-form-dialog">取消</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://codepanion.local/markdown.js"></script>
    <script src="https://codepanion.local/projects.js"></script>
    <script src="https://codepanion.local/settings.js"></script>
    <script src="https://codepanion.local/codex.js"></script>
</body>
</html>
