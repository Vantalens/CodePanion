[package]
name = "codepanion-workflow-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
codepanion-providers = { path = "../providers" }
codepanion-shared = { path = "../shared" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
dirs = "5.0"

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt"] }
tempfile = "3.0"

[lib]
path = "src/lib.rs"
