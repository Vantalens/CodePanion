[package]
name = "codepanion-daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
codepanion-shared = { path = "../shared" }
codepanion-workflow-engine = { path = "../workflow-engine" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors"] }
dirs = "5"

[lib]
path = "src/lib.rs"

[[bin]]
name = "codepanion-daemon"
path = "src/main.rs"
